<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoiceCraft 26.2</title>
<link rel="icon" href="icon.png">
<meta name="description" content="MoiceCraft 26.2 – ein Klick, fertige Instanz im Minecraft Launcher.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0F;
    --text: #E8E8EC;
    --dim: #7A7A88;
    --purple: #9A6BE8;
    --pixel: "Press Start 2P", ui-monospace, Monaco, monospace;
    --mono: ui-monospace, "SF Mono", Monaco, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 18px 40px;
    overflow: hidden;
  }

  /* the falling pixel mosaic, kept far in the back and very quiet */
  #pixels { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .5; }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 32%, rgba(0,0,0,.58) 80%),
      radial-gradient(ellipse at 50% 40%, rgba(154,107,232,.12), transparent 62%);
  }

  main {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #stage { width: 100%; height: min(30vh, 210px); }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; }
  #fallback { display: none; width: 100%; height: 100%; object-fit: contain; }

  /* ---------- the lever ---------- */
  .lever-wrap {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #lever {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    line-height: 0;
    filter: drop-shadow(0 12px 20px rgba(0,0,0,.6));
    transition: transform .08s;
  }
  #lever:focus-visible { outline: 2px solid var(--purple); outline-offset: 8px; }
  #lever:hover { transform: translateY(-2px); }
  #lever:active { transform: translateY(1px); }
  #lever svg { width: 168px; height: auto; shape-rendering: crispEdges; }

  #handle {
    transform-origin: 16.5px 17px;
    transform: rotate(-34deg);
    transition: transform .34s cubic-bezier(.2, 1.7, .35, 1);
  }
  #lever:hover #handle { transform: rotate(-40deg); }
  #lever.on #handle,
  #lever.on:hover #handle { transform: rotate(34deg); }

  #glow { opacity: 0; transition: opacity .25s; }
  #lever.on #glow { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

  .label {
    font-family: var(--pixel);
    font-size: 13px;
    letter-spacing: .04em;
    color: var(--text);
    text-align: center;
    text-shadow: 2px 2px 0 #000;
    transition: color .2s;
    margin: 0;
  }
  .label.running { color: #7FE06A; }

  .meta {
    margin-top: 30px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .06em;
    text-align: center;
    line-height: 1.9;
  }
  .meta b { color: #A9A9B8; font-weight: 400; }

  footer {
    position: fixed;
    bottom: 14px;
    left: 0; right: 0;
    z-index: 2;
    text-align: center;
    font-family: var(--pixel);
    font-size: 8px;
    letter-spacing: .16em;
    color: #3E3E48;
  }

  @media (max-width: 560px) {
    #stage { height: 22vh; }
    #lever svg { width: 132px; }
    .label { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #handle { transition: none; }
    #lever.on #glow { animation: none; }
  }
</style>
</head>
<body>
<canvas id="pixels"></canvas>

<main>
  <div id="stage"><img id="fallback" src="logo.png" alt="MoiceCraft 26.2 Update"></div>

  <div class="lever-wrap">
    <button id="lever" type="button" aria-label="Hebel umlegen und Download starten">
      <!-- a lever, drawn on a 33 x 24 pixel grid -->
      <svg viewBox="0 0 33 24" role="img" aria-hidden="true">
        <!-- redstone glow behind the base -->
        <g id="glow">
          <rect x="8"  y="15" width="17" height="8" fill="#FF3B30" opacity=".22"/>
          <rect x="10" y="14" width="13" height="9" fill="#FF6B60" opacity=".18"/>
        </g>

        <!-- cobblestone base -->
        <rect x="9"  y="16" width="15" height="7" fill="#3A3A3E"/>
        <rect x="10" y="17" width="13" height="5" fill="#6E6E74"/>
        <rect x="11" y="18" width="4"  height="2" fill="#83838A"/>
        <rect x="17" y="18" width="3"  height="1" fill="#83838A"/>
        <rect x="15" y="20" width="3"  height="1" fill="#57575D"/>
        <rect x="20" y="20" width="2"  height="1" fill="#57575D"/>
        <rect x="10" y="21" width="13" height="1" fill="#4A4A50"/>

        <!-- handle: a stick with a knob, pivots on the base -->
        <g id="handle">
          <rect x="15" y="14" width="3" height="4"  fill="#5A4630"/>
          <rect x="15" y="6"  width="3" height="9"  fill="#7B5E3C"/>
          <rect x="15" y="6"  width="1" height="9"  fill="#96754C"/>
          <rect x="14" y="2"  width="5" height="5"  fill="#3A3A3E"/>
          <rect x="15" y="3"  width="3" height="3"  fill="#C8C8CE"/>
          <rect x="15" y="3"  width="2" height="1"  fill="#EFEFF3"/>
        </g>
      </svg>
    </button>
    <p class="label" id="label">Hebel ziehen</p>
  </div>

  <p class="meta">
    <b>Windows &amp; macOS</b> &nbsp;·&nbsp; ca. 1,3 GB &nbsp;·&nbsp; entpacken und starten<br>
    auf dem Mac beim ersten Mal per Rechtsklick öffnen
  </p>
</main>

<footer>Gehostet von MoiceCraft</footer>

<script>
const DOWNLOAD_URL = "https://www.dropbox.com/scl/fi/kq3hu6xt6xqo5heuqw591/MoiceCraft-26.2-Installer.zip?rlkey=8aqx7xvmnfi2pru2g6dmdyhde&dl=1";

/* ---------- lever ---------- */
(() => {
  const lever = document.getElementById('lever');
  const label = document.getElementById('label');
  let busy = false;

  lever.addEventListener('click', () => {
    if (busy) return;
    busy = true;
    lever.classList.add('on');
    label.textContent = 'Download läuft …';
    label.classList.add('running');
    clack();
    // let the handle land before the browser starts pulling the file
    setTimeout(() => { window.location.href = DOWNLOAD_URL; }, 260);
    setTimeout(() => {
      lever.classList.remove('on');
      label.classList.remove('running');
      label.textContent = 'Nochmal ziehen';
      busy = false;
    }, 4200);
  });

  /* a short wooden clack, synthesised so the page stays a single file */
  function clack() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.09);
      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.13);
      setTimeout(() => ctx.close(), 400);
    } catch (e) { /* sound is a bonus, never a problem */ }
  }
})();

/* ---------- background: slow mosaic of pixels drifting down ---------- */
(() => {
  const canvas = document.getElementById('pixels');
  const ctx = canvas.getContext('2d');
  const CELL = 14;
  let cols = 0, rows = 0, drops = [];

  function reset() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    cols = Math.ceil(canvas.width / CELL);
    rows = Math.ceil(canvas.height / CELL);
    drops = Array.from({ length: cols }, () => ({
      y: Math.random() * rows,
      speed: 0.012 + Math.random() * 0.05,
      life: Math.random(),
    }));
  }
  reset();
  addEventListener('resize', reset);

  function frame() {
    // fade the previous frame instead of clearing, which leaves soft trails
    ctx.fillStyle = 'rgba(11,11,15,0.16)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < cols; i++) {
      const d = drops[i];
      d.y += d.speed;
      d.life += 0.004;
      if (d.y > rows + 2) {
        d.y = -Math.random() * 8;
        d.speed = 0.012 + Math.random() * 0.05;
      }
      const flicker = 0.35 + 0.65 * Math.abs(Math.sin(d.life * 2.1 + i));
      const a = 0.05 + flicker * 0.10;
      ctx.fillStyle = `rgba(154,107,232,${a})`;
      ctx.fillRect(i * CELL, Math.floor(d.y) * CELL, CELL - 2, CELL - 2);
      ctx.fillStyle = `rgba(120,90,180,${a * 0.45})`;
      ctx.fillRect(i * CELL, (Math.floor(d.y) - 1) * CELL, CELL - 2, CELL - 2);
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
  const stage = document.getElementById('stage');
  const fallback = document.getElementById('fallback');
  const showFallback = () => { fallback.style.display = 'block'; };

  try {
    const THREE = await import('three');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 4000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    // A generated room gives the metal something to reflect - that is what makes it read as chrome.
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 3.2);
    key.position.set(-1.1, 1.5, 2.2);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xB98BFF, 2.4);
    rim.position.set(1.6, -0.8, -1.4);
    scene.add(rim);
    const top = new THREE.DirectionalLight(0xffffff, 1.4);
    top.position.set(0.2, 2.4, -0.6);
    scene.add(top);

    const pivot = new THREE.Group();
    scene.add(pivot);

    new GLTFLoader().load('logo.glb', (gltf) => {
      const model = gltf.scene;

      /*
       * The word comes out of a Three.js scene where the black outline was a scaled-up copy with
       * its front faces culled. glTF cannot store that, so those shells would sit in front of the
       * letters - drawing only their back faces puts the outline back where it belongs.
       * The lettering itself gets a polished metal finish, the shells stay matte.
       */
      model.traverse((child) => {
        if (!child.isMesh) return;
        const list = Array.isArray(child.material) ? child.material : [child.material];
        const made = list.map((m) => {
          if (!m) return m;
          const metal = new THREE.MeshPhysicalMaterial({
            map: m.map || null,
            color: m.map ? 0xffffff : (m.color ? m.color.clone() : new THREE.Color(0x000000)),
          });
          if (m.map) {
            m.map.colorSpace = THREE.SRGBColorSpace;
            metal.metalness = 0.95;
            metal.roughness = 0.13;
            metal.envMapIntensity = 2.4;
            metal.clearcoat = 0.9;
            metal.clearcoatRoughness = 0.08;
            metal.side = THREE.FrontSide;
          } else {
            metal.metalness = 0.25;
            metal.roughness = 0.55;
            metal.envMapIntensity = 0.35;
            metal.side = THREE.BackSide;      // the outline shell
          }
          return metal;
        });
        child.material = made.length === 1 ? made[0] : made;
      });

      // swing around the middle of the word
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(box.getCenter(new THREE.Vector3()));
      pivot.add(model);

      const fit = () => {
        const w = stage.clientWidth, h = stage.clientHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        const fov = camera.fov * Math.PI / 180;
        const distH = (size.y / 2) / Math.tan(fov / 2);
        const distW = (size.x / 2) / Math.tan(fov / 2) / camera.aspect;
        // Extra room: turned towards the camera the near end grows, so a snug fit would clip
        // the outer letters at the ends of the swing.
        camera.position.set(0, 0, Math.max(distH, distW) * 1.46);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
      };
      fit();
      addEventListener('resize', fit);

      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const t = clock.getElapsedTime();
        // A slow swing rather than a full turn: the word is very wide, so a full spin would
        // spend half its time edge-on as a thin sliver. Swinging keeps it readable and lets
        // the light travel across the metal, which is what sells the chrome.
        pivot.rotation.y = Math.sin(t * 0.42) * 0.40;        // about 23 degrees each way
        pivot.rotation.x = Math.sin(t * 0.27) * 0.10 - 0.04; // gentle nod
        pivot.rotation.z = Math.sin(t * 0.19) * 0.03;
        pivot.position.y = Math.sin(t * 0.6) * size.y * 0.035;
        renderer.render(scene, camera);
      });
    }, undefined, showFallback);
  } catch (e) {
    showFallback();
  }
</script>
</body>
</html>
